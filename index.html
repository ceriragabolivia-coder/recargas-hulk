<!doctype html>
<html lang="es">

    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    
    <!-- Open Graph / Redes Sociales -->
    <meta property="og:title" content="Recargas Hulk" />
    <meta property="og:description" content="Centro de Recargas Hulk" />
    <meta property="og:image" content="https://recargashulk.com/logo.png" />

    <title>Recargas Hulk</title>
    <script>
      (function(){
        // Unregister any old Service Workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
          });
        }
        
        var currentVersion = "v2.4";
        if (localStorage.getItem("app_version") !== currentVersion) {
          localStorage.clear();
          localStorage.setItem("app_version", currentVersion);
          if (window.location.search.indexOf("v=" + currentVersion) === -1) {
            var sep = window.location.href.indexOf("?") === -1 ? "?" : "&";
            window.location.replace(window.location.href + sep + "v=" + currentVersion);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
